<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/homeaccessiq-apple-touch-icon-180.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>HomeAccessIQ — Agent Sign In</title>
<style>
  :root {
    --bg-dark: #0f1420;
    --accent-red: #c0392b;
    --text-light: #f5f5f7;
    --text-muted: #9099a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    background: var(--accent-red);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
  }
  .brand-name {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .brand-sub {
    font-size: 12px;
    color: #888;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d8dade;
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 18px;
    transition: border-color 0.15s;
  }
  input:focus {
    outline: none;
    border-color: var(--accent-red);
  }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent-red);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.92; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-message {
    background: #fdecea;
    color: #b3261e;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
  }
  .error-message.visible { display: block; }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-mark">🏠</div>
    <div class="brand-name">HomeAccessIQ</div>
  </div>
  <img class="creator-logo" src="assets/img/smartiq-realty-logo-light-small.svg" alt="SmartIQ Realty" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
  <div class="brand-sub">Brokered by Fathom Realty</div>

  <h1>Agent Sign In</h1>

  <div id="error-box" class="error-message"></div>

  <form id="login-form" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="submit-btn">Sign In</button>
  </form>

  <p class="footer-note">Access restricted to authorized agents only.</p>
</div>

<script type="module">
  import { supabaseClient } from '/js/supabaseClient.js';

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  // If already signed in, skip straight to the app
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    window.location.href = './index.html';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = error.message === 'Invalid login credentials'
        ? 'Incorrect email or password.'
        : error.message;
      errorBox.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    // Success — session is now persisted by the Supabase client
    window.location.href = './index.html';
  });
</script>

</body>
</html>
